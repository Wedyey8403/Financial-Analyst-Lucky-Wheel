<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Wheel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { text-align: center; font-family: sans-serif; background: #121212; color: white; padding-top: 20px; }
        #wheel { width: 260px; height: 260px; border-radius: 50%; border: 5px solid #2ea6ff; margin: 20px auto; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: conic-gradient(#ff4757 0deg 45deg, #2ed573 45deg 90deg, #ffa502 90deg 135deg, #1e90ff 135deg 180deg, #ff6b81 180deg 225deg, #70a1ff 225deg 270deg, #5352ed 270deg 315deg, #2ed573 315deg 360deg); }
        button { padding: 12px 30px; font-size: 18px; font-weight: bold; background: #2ea6ff; color: white; border: none; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🎰 लकी व्हील स्पिन करें 🎰</h2>
    <div id="wheel"></div>
    <br>
    <button id="spinBtn" onclick="spinWheel()">SPIN NOW</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "GUEST_" + Math.floor(Math.random()*1000);

        function spinWheel() {
            if (localStorage.getItem("spinned_" + userId)) {
                alert("आप पहले ही स्पिन कर चुके हैं!");
                return;
            }

            const rand = Math.random() * 100;
            let result = "Try Again Later";
            let deg = 1440 + 30; 

            if (rand < 5) { result = "₹800"; deg = 1440 + 200; }
            else if (rand < 30) { result = "₹200"; deg = 1440 + 100; }
            else if (rand < 65) { result = "Zero"; deg = 1440 + 300; }

            document.getElementById("wheel").style.transform = "rotate(" + deg + "deg)";
            
            setTimeout(() => {
                alert("आपका रिजल्ट: " + result);
                localStorage.setItem("spinned_" + userId, "true");

                if (result !== "Zero" && result !== "Try Again Later") {
                    let name = prompt("अपना नाम दर्ज करें:");
                    let upi = prompt("अपनी UPI/Paytm ID दर्ज करें:");
                    alert("थैंक यू! आपका रिस्पॉन्स सबमिट हो गया है।");
                }
                tg.close();
            }, 4000);
        }
    </script>
</body>
</html>
